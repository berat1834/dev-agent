<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Agent AI Control Center</title>
    <!-- TEMİZ CDN LINKLERİ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #34d399; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; }
        .markdown-body code { background-color: #0f172a; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem; color: #38bdf8; }
        .markdown-body p { margin-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-slate-950">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center pb-6 mb-8 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-emerald-500/10 rounded-xl border border-emerald-500/20 text-emerald-400">
                    <i class="fa-solid fa-robot text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">Dev-Agent Control Center</h1>
                    <p class="text-xs text-slate-400">Otonom Kod Analiz & Refactor Sistemi</p>
                </div>
            </div>
            <span class="text-xs font-mono bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20">v1.0.0 Enterprise</span>
        </header>

        <!-- Control Bar -->
        <div class="bg-slate-900/60 p-6 rounded-2xl border border-slate-800 mb-8 backdrop-blur shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Proje Dizini</label>
                    <input type="text" id="projectPath" value="." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">AI Sağlayıcısı</label>
                    <select id="providerSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 transition">
                        <option value="gemini">Google Gemini 2.5</option>
                        <option value="ollama">Local Ollama</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="runAnalysis()" id="analyzeBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-6 py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-500/10">
                        <i class="fa-solid fa-magnifying-glass"></i> Analiz Et
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-16">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-400 mb-4"></i>
            <p class="text-slate-400 font-medium">Agent dosyaları inceliyor ve tavsiyeleri hazırlıyor...</p>
        </div>

        <!-- Dashboard Grid -->
        <div id="results" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Scanned Files Panel -->
            <div class="bg-slate-900/40 p-5 rounded-2xl border border-slate-800 h-fit">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center justify-between">
                    <span>Taranan Dosyalar</span>
                    <span id="fileCount" class="bg-slate-800 text-emerald-400 px-2 py-0.5 rounded-md font-mono text-xs">0</span>
                </h3>
                <div id="fileList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
            </div>

            <!-- Report Panel -->
            <div class="lg:col-span-2 bg-slate-900/40 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-base font-semibold text-emerald-400 mb-4 flex items-center gap-2 pb-3 border-b border-slate-800">
                    <i class="fa-solid fa-square-poll-vertical"></i> Mimari ve Geliştirme Raporu
                </h2>
                <div id="reportContent" class="markdown-body text-slate-300 text-sm leading-relaxed"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 hidden bg-slate-900 border border-emerald-500/30 text-slate-200 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg" class="text-sm">İşlem tamamlandı.</span>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        async function runAnalysis() {
            const path = document.getElementById('projectPath').value;
            const provider = document.getElementById('providerSelect').value;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            loading.classList.remove('hidden');
            results.classList.add('hidden');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path, provider: provider })
                });
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    document.getElementById('fileCount').innerText = data.scanned_files.length;
                    
                    const fileList = document.getElementById('fileList');
                    fileList.innerHTML = data.scanned_files.map(f => `
                        <div class="flex items-center justify-between p-2.5 bg-slate-950 border border-slate-800 rounded-xl hover:border-slate-700 transition">
                            <span class="text-xs font-mono text-slate-300 truncate max-w-[180px]">${f}</span>
                            <button onclick="fixFile('${f}')" class="text-xs bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                                <i class="fa-solid fa-wrench text-[10px]"></i> Fix
                            </button>
                        </div>
                    `).join('');

                    document.getElementById('reportContent').innerHTML = marked.parse(data.analysis);
                    results.classList.remove('hidden');
                    showToast("Proje analizi başarıyla tamamlandı!");
                } else {
                    alert('Hata: ' + (data.detail || data.message));
                }
            } catch (err) {
                alert('Sunucu hatası!');
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function fixFile(filePath) {
            const provider = document.getElementById('providerSelect').value;
            if(!confirm(`'${filePath}' dosyasına AI refactoring uygulamak istediğinize emin misiniz?`)) return;

            showToast(`'${filePath}' düzenleniyor...`);
            try {
                const response = await fetch('/api/fix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_path: filePath, provider: provider })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(`✅ ${filePath} başarıyla refactor edildi!`);
                } else {
                    alert('Fix Hatası: ' + data.detail);
                }
            } catch (err) {
                alert('Bağlantı hatası!');
            }
        }
    </script>
</body>
</html>
